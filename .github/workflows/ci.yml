name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Formatting and vet are part of the build script locally, so they are
      # part of the gate here: a change that fails either should not merge.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal embed.go)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  # Builds every agent target and both server targets, then uploads the
  # binaries as a release artifact. Runs in parallel with the image build so
  # the cross-compile matrix does not delay the published image.
  binaries:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build.sh --all

      - uses: actions/upload-artifact@v4
        with:
          name: needle-binaries
          path: dist/
          retention-days: 30

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest on main, plus a semver set when a vX.Y.Z tag is pushed,
      # plus an immutable sha-<commit> that a deployment can pin to.
      - name: derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/needle
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
